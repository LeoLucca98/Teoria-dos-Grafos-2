<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 16 10">
  <defs>
    <style>
      .obs { fill: #cccccc; stroke: #000000; stroke-width: 0.05; }
      .start { stroke: #d62828; stroke-width: 0.12; }
      .goal { fill: #2a9d8f; stroke: #1b6f63; stroke-width: 0.06; }
      .frame { fill: none; stroke: #888; stroke-width: 0.04; }
      .label { font-size: 0.5px; font-family: Arial, Helvetica, sans-serif; fill: #222; }
    </style>
  </defs>
  <!-- Inverte o eixo Y para usar coordenadas cartesianas -->
  <g transform="scale(1,-1) translate(0,-10)">
    <!-- Moldura opcional -->
    <rect class="frame" x="0.25" y="0.25" width="15.5" height="9.5" />

    <!-- Obstáculos (do arquivo data/map_autoral_prof.txt) -->
    <polygon class="obs" points="3,6 5.5,6 5.8,4.2 3.2,4" />
    <polygon class="obs" points="8,8.5 10.5,8 11.2,6.6 9.6,5.6 7.8,6.8" />
    <polygon class="obs" points="12.5,3.5 13.8,1.5 11.6,1.2" />

    <!-- Start (X vermelho) em (2,9) -->
    <g class="start">
      <line x1="1.8" y1="8.8" x2="2.2" y2="9.2" />
      <line x1="1.8" y1="9.2" x2="2.2" y2="8.8" />
    </g>
    <text class="label" x="2.25" y="9.15" transform="scale(1,-1) translate(0,-18.3)">Start (2,9)</text>

    <!-- Goal (quadrado verde) em (14,2) -->
    <rect class="goal" x="13.8" y="1.8" width="0.4" height="0.4" />
    <text class="label" x="14.3" y="2.15" transform="scale(1,-1) translate(0,-4.3)">Goal (14,2)</text>
  </g>
</svg>
